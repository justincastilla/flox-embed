  "manifest": {
    "schema-version": "1.10.0",
    "install": {
      "curl": {
        "pkg-path": "curl"
      },
      "fastapi": {
        "pkg-path": "python313Packages.fastapi",
        "pkg-group": "py"
      },
      "jq": {
        "pkg-path": "jq"
      },
      "pydantic": {
        "pkg-path": "python313Packages.pydantic",
        "pkg-group": "py"
      },
      "python": {
        "pkg-path": "python313",
        "pkg-group": "py"
      },
      "sentence-transformers": {
        "pkg-path": "python313Packages.sentence-transformers",
        "pkg-group": "py"
      },
      "uvicorn": {
        "pkg-path": "python313Packages.uvicorn",
        "pkg-group": "py"
      }
    },
    "vars": {
      "EMBED_MODEL": "sentence-transformers/all-MiniLM-L6-v2",
      "EMBED_PORT": "8000"
    },
    "hook": {
      "on-activate": "  # Keep the model cache inside the environment rather than ~/.cache, so it is\n  # per-project and already gitignored. $FLOX_ENV_CACHE is provided by Flox.\n  export HF_HOME=\"$FLOX_ENV_CACHE/huggingface\"\n  export SENTENCE_TRANSFORMERS_HOME=\"$FLOX_ENV_CACHE/sentence-transformers\"\n  mkdir -p \"$HF_HOME\" \"$SENTENCE_TRANSFORMERS_HOME\"\n\n  # Pre-warm the model so the first /embed is not a download.\n  # Sentinel-guarded: downloads once, ever.\n  # Skip with FLOX_EMBED_SKIP_PREWARM=1.\n  if [ -z \"$FLOX_EMBED_SKIP_PREWARM\" ] && [ ! -f \"$SENTENCE_TRANSFORMERS_HOME/.warmed\" ]; then\n    echo \"→ pre-warming $EMBED_MODEL (one time)\"\n    if python -c \"\nfrom sentence_transformers import SentenceTransformer\nSentenceTransformer('$EMBED_MODEL', device='cpu').encode(['warmup'])\n\" >\"$SENTENCE_TRANSFORMERS_HOME/prewarm.log\" 2>&1; then\n      touch \"$SENTENCE_TRANSFORMERS_HOME/.warmed\"\n      echo \"→ model cached\"\n    else\n      echo \"→ pre-warm failed; the API will fetch on first request. Reason:\"\n      tail -5 \"$SENTENCE_TRANSFORMERS_HOME/prewarm.log\" | sed 's/^/    /'\n    fi\n  fi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "api": {
        "command": "exec uvicorn app:app --host 0.0.0.0 --port \"$EMBED_PORT\" ${EMBED_RELOAD:+--reload --reload-dir \"$FLOX_ENV_PROJECT\"}"
      }
    },
    "containerize": {
      "config": {
        "exposed-ports": [
          "8000/tcp"
        ],
        "cmd": []
      }
    }
  },
